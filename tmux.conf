# Status bar: one clickable label per session. Clicking a label switches to that session (the
# default MouseDown1Status binding, switch-client -t =). claude-hooks/tmux-turn.sh sets a session's
# @agent_waiting when an agent in it is waiting on you: "1" is orange, "bg" (your turn, but its
# background subagents or shells are still running) is blue. Otherwise an attached session is
# reversed. claude-hooks/tmux-shells.sh, run by the #() every status-interval, sets @agent_shells
# to the count of an agent's shells still running in the session and the oldest one's age, shown
# after the name as "⋯2 14m", and turns a blue session orange once none of its shells or
# subagents are left running. The status line redraws once a minute.
set -g mouse on
set -g status-interval 60
set -g status-left-length 200
set -g status-left "#{S:#[range=session|#{session_id}]#{?#{==:#{@agent_waiting},bg},#[bg=colour33 fg=black bold],#{?#{@agent_waiting},#[bg=colour208 fg=black bold],#{?session_attached,#[reverse],}}} #S#{?#{@agent_shells}, ⋯#{@agent_shells},} #[norange default]}#($HOME/.dotfiles/claude-hooks/tmux-shells.sh)"

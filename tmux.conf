# Status bar: one clickable label per session. Clicking a label switches to that session (the
# default MouseDown1Status binding, switch-client -t =). A session whose @agent_waiting is set (by
# claude-hooks/tmux-turn.sh) is orange: an agent in it is waiting on you. Otherwise an attached
# session is reversed.
set -g mouse on
set -g status-left-length 100
set -g status-left "#{S:#[range=session|#{session_id}]#{?#{@agent_waiting},#[bg=colour208 fg=black bold],#{?session_attached,#[reverse],}} #S #[norange default]}"
